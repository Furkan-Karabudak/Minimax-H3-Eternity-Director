[project]
name = "minimaxh3-director-extended"
description = "A timeline editor for MiniMax H3 — storyboard prompts, first/last keyframes, image/video/audio references, native joint audio, live sampling preview, retakes and shot chaining."
version = "0.2.0"
license = { file = "LICENSE" }
requires-python = ">=3.10"
# Nothing beyond what ComfyUI itself already installs.
dependencies = []
classifiers = [
    "License :: OSI Approved :: GNU General Public License v3 (GPLv3)",
    "Operating System :: OS Independent",
    "Environment :: GPU :: NVIDIA CUDA",
]

[project.urls]
Repository = "https://github.com/vomitselfie/ComfyUI-MiniMaxH3-Director-Extended"
"Bug Tracker" = "https://github.com/vomitselfie/ComfyUI-MiniMaxH3-Director-Extended/issues"

[tool.comfy]
# Must match the publisher you create at https://registry.comfy.org
PublisherId = ""
DisplayName = "MiniMax H3 Director"
Icon = ""
# comfy_api.latest, the packed AV latent and H3 support all landed in ComfyUI 0.30.0.
requires-comfyui = ">=0.30.0"
