[project]
name = "minimaxh3-director-extended"
description = "A fork of MiniMax H3 Director (seesee75-commits): long-form chaining past H3's ~15s ceiling in one node, two-phase GPU decode, audio-seam handling, and a saveable gen-log — on top of upstream's timeline editor, typed references, dialogue and prompt compiler."
version = "0.3.0"
license = { file = "LICENSE" }
requires-python = ">=3.10"
# Nothing beyond what ComfyUI itself already installs.
dependencies = []
classifiers = [
    "License :: OSI Approved :: GNU General Public License v3 (GPLv3)",
    "Operating System :: OS Independent",
    "Environment :: GPU :: NVIDIA CUDA",
]

[project.urls]
Repository = "https://github.com/vomitselfie/ComfyUI-MiniMaxH3-MV-Director"
"Bug Tracker" = "https://github.com/vomitselfie/ComfyUI-MiniMaxH3-MV-Director/issues"
Upstream = "https://github.com/seesee75-commits/ComfyUI-MiniMaxH3-Director"

[tool.comfy]
# Must match the publisher you create at https://registry.comfy.org
PublisherId = "vomitselfie"
DisplayName = "MiniMax H3 Director (MV)"
Icon = ""
# comfy_api.latest, the packed AV latent and H3 support all landed in ComfyUI 0.30.0.
requires-comfyui = ">=0.30.0"
